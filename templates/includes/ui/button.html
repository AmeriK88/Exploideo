{% if href %}
  <a href="{{ href }}" class="{{ class|default:'c-button c-button--primary' }}{% if extra_class %} {{ extra_class }}{% endif %}"{% if attrs %} {{ attrs|safe }}{% endif %}>{{ label }}</a>
{% else %}
  <button type="{{ type|default:'button' }}" class="{{ class|default:'c-button c-button--primary' }}{% if extra_class %} {{ extra_class }}{% endif %}"{% if name %} name="{{ name }}"{% endif %}{% if value %} value="{{ value }}"{% endif %}{% if attrs %} {{ attrs|safe }}{% endif %}>{{ label }}</button>
{% endif %}

<div class="{{ wrapper_class|default:'o-cta-actions' }}">
  
  <a href="{{ primary_url }}"
     class="{{ primary_class|default:'c-button c-button--primary' }}">
    {{ primary_label }}
  </a>

  {% if user.is_authenticated %}
    <a href="{% url authed_url|default:'pages:dashboard' %}"
       class="{{ secondary_class|default:'c-button c-button--ghost' }}">
      {{ authed_label|default:'Ir a mi panel' }}
    </a>
  {% else %}
    {% if secondary_url and secondary_label %}
      <a href="{{ secondary_url }}"
         class="{{ secondary_class|default:'c-button c-button--ghost' }}">
        {{ secondary_label }}
      </a>
    {% endif %}
  {% endif %}

</div>

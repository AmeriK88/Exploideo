
{% with accent=accent|default:"indigo" %}
<figure class="rounded-3xl border border-border bg-surface-soft p-6">
  <blockquote class="text-sm u-text leading-relaxed">
    “{{ r.comment }}”
  </blockquote>

  <figcaption class="mt-4 flex items-center gap-3">

    {# Avatar o inicial #}
    {% if r.traveler.traveler_profile.avatar %}
      <img
        src="{{ r.traveler.traveler_profile.avatar.url }}"
        alt="{{ r.traveler.username }}"
        class="h-10 w-10 rounded-2xl object-cover ring-1 ring-(--border) bg-surface"
        loading="lazy"
      >
    {% else %}
      <div class="grid h-10 w-10 place-items-center rounded-2xl font-bold bg-surface text-text ring-1 ring-(--border)">
        {{ r.traveler.username|slice:":1"|upper }}
      </div>
    {% endif %}

    <div class="min-w-0">
      <p class="text-sm font-semibold truncate">
        {{ r.traveler.username }}
        {% if r.experience.location %}
          · {{ r.experience.location }}
        {% endif %}
      </p>
      <p class="text-xs u-muted truncate">
        Viajero · {{ r.experience.title }}
      </p>
    </div>

    <span class="ml-auto shrink-0 inline-flex items-center rounded-full border border-border bg-surface px-2.5 py-1 text-xs font-medium u-text">
      ⭐ {{ r.rating }}/5
    </span>

  </figcaption>
</figure>
{% endwith %}

<form
  method="get"
  action="{% if search_action_url %}{{ search_action_url }}{% else %}{% url 'helpdesk:helpdesk' %}{% endif %}"
  class="panel-soft"
>
  <div class="o-stack o-stack--4">

    <!-- Head -->
    <div class="o-cluster o-cluster--4" style="justify-content: space-between; align-items: flex-start;">
      <div class="o-stack o-stack--2">
        <h2 class="h2-section">
          {{ search_title|default:"Buscar en el centro de ayuda" }}
        </h2>
        <p class="p-micro u-muted">
          {{ search_subtitle|default:"Escribe una palabra clave: cancelación, cambios, reembolso..." }}
        </p>
      </div>

      {% if search_badge %}
        <span class="c-badge c-badge--neutral u-hover-lift">{{ search_badge }}</span>
      {% endif %}
    </div>

    <!-- Controls -->
    <div class="o-cta-actions">
      <div style="flex: 1 1 auto;">
        <label class="sr-only" for="helpdesk_q">Buscar</label>
        <input
          id="helpdesk_q"
          class="input"
          type="text"
          name="q"
          value="{{ request.GET.q|default:'' }}"
          placeholder="{{ search_placeholder|default:'Buscar artículos…' }}"
        />
      </div>

      <button class="c-button c-button--primary" type="submit">
        {{ search_button|default:"Buscar" }}
      </button>

      {% if request.GET.q or q %}
        <a href="{% url 'helpdesk:helpdesk' %}" class="c-button c-button--ghost text-center">
          Limpiar
        </a>
      {% endif %}
    </div>

  </div>
</form>

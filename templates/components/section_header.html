<div class="c-sectionHead">
  <div class="c-sectionHead__text o-stack o-stack--2">
    <h2 class="{{ title_class|default:'c-sectionHead__title' }}">{{ title }}</h2>

    {% if subtitle %}
      <p class="c-sectionHead__subtitle u-muted">{{ subtitle }}</p>
    {% endif %}
  </div>

  {% if cta_url and cta_label %}
    <a href="{{ cta_url }}" class="{{ cta_class|default:'c-button c-button--ghost c-sectionHead__cta' }}">
      {{ cta_label }}
    </a>
  {% endif %}
</div>
